# Tool configuration only. Dependencies live in requirements*.txt (simpler Docker layer caching).
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["**/migrations/*"]

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, bugbear, pyupgrade, django-specific, simplify
select = ["E", "W", "F", "I", "B", "UP", "DJ", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["mypy_django_plugin.main"]
exclude = ["/migrations/"]

[[tool.mypy.overrides]]
module = ["environ.*"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "config.settings"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
testpaths = ["tests"]
